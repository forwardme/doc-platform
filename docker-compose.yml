services:
  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-change-me-please}
      AUTH_SECRET: ${AUTH_SECRET:-please-change-this-to-a-long-random-string}
    volumes:
      - ./data:/app/data
    restart: unless-stopped
